<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laipsnio su natūraliuoju rodikliu savybės</title>
<style>
  :root{
    --bg:#eef2f7; --kort:#fff; --tekst:#1c2430; --pilka:#5b6472; --linija:#d8dee6;
    --tema:#1e5fa8; --tema-t:#2b74c4; --ok:#1e7e34; --ok-f:#eaf6ec; --ne:#b91c1c; --ne-f:#fdecec;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#131720; --kort:#1c2230; --tekst:#e7ecf3; --pilka:#9aa6b6; --linija:#2c3648;
      --ok-f:#113322; --ne-f:#3a1414;}
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--tekst); font-family:"Segoe UI",system-ui,sans-serif;
    line-height:1.5; font-size:16px;}
  .wrap{max-width:760px; margin:0 auto; padding:0 0 60px}
  header{background:linear-gradient(135deg,var(--tema),var(--tema-t)); color:#fff; padding:34px 24px 28px}
  header h1{font-size:28px; margin:0 0 10px}
  header p{margin:0; font-size:14.5px; opacity:.95; max-width:640px}
  .korpusas{padding:20px 20px 0}
  .grizti{display:inline-block; margin:16px 0 0; color:var(--tema-t); font-size:13px; text-decoration:none}
  .grizti:hover{text-decoration:underline}

  .juosta{background:var(--kort); border:1px solid var(--linija); border-radius:14px;
    padding:14px 18px; margin:16px 0; display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; box-shadow:0 3px 14px rgba(0,0,0,.06)}
  .busena{font-weight:600; font-size:14.5px}
  .busena.ok{color:var(--ok)} .busena.ne{color:var(--ne)}
  .mygtukai{display:flex; gap:8px; flex-wrap:wrap}
  .btn{border:none; border-radius:10px; padding:11px 18px; font-size:14.5px; font-weight:600;
    cursor:pointer; font-family:inherit; white-space:nowrap}
  .btn-p{background:var(--tema); color:#fff}
  .btn-a{background:var(--linija); color:var(--tekst)}
  .btn:active{transform:translateY(1px)}

  .pastabos{font-size:12.5px; color:var(--pilka); margin:0 0 18px; line-height:1.6}

  .grupe{background:var(--kort); border:1px solid var(--linija); border-radius:14px;
    padding:18px 20px; margin-bottom:16px; box-shadow:0 3px 14px rgba(0,0,0,.05)}
  .grupe h2{font-size:17px; margin:0 0 4px; color:var(--tema-t)}
  .grupe .nuoroda{font-size:13.5px; color:var(--pilka); margin:0 0 14px}
  .uzd{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:9px 0;
    border-top:1px solid var(--linija)}
  .uzd:first-of-type{border-top:none}
  .uzd .klaus{font-size:19px; flex:1 1 200px; min-width:160px}
  .uzd .klaus svg{display:block; max-width:300px; width:100%; height:auto; margin:8px 0}
  .uzd input[type=text]{font-size:17px; width:150px; padding:7px 10px; text-align:center;
    border:2px solid var(--linija); border-radius:9px; font-family:inherit; background:var(--kort); color:var(--tekst)}
  .uzd input[type=text]:focus{outline:none; border-color:var(--tema)}
  .uzd input[type=text].ok{border-color:var(--ok); background:var(--ok-f)}
  .uzd input[type=text].ne{border-color:var(--ne); background:var(--ne-f)}
  .zenklas{font-size:19px; width:22px; text-align:center}
  .ivedimas{display:flex; flex-direction:column; gap:4px; align-items:center}
  .simb-row{display:flex; gap:3px}
  .simb-row button{border:1px solid var(--linija); background:var(--bg); color:var(--tekst);
    border-radius:6px; width:24px; height:24px; font-size:13px; line-height:1; cursor:pointer;
    padding:0; font-family:inherit}
  .simb-row button:hover{background:var(--linija)}
  @media print{ .ivedimas .simb-row{display:none!important} }
  .sprendimas{flex-basis:100%; font-size:13.5px; color:var(--pilka); background:var(--bg);
    border-radius:8px; padding:8px 12px; margin-top:4px; display:none}
  .sprendimas b{color:var(--tekst)}

  footer{text-align:center; margin-top:24px; font-size:12.5px; color:var(--pilka); padding-bottom:10px}

  .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.02;margin:0 3px}
  .fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 4px}
  .fr>span:last-child{padding:0 4px}
  .sqrt{display:inline-flex;align-items:flex-end;margin:0 .05em .05em}
  .sqrt::before{content:"√";font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.25em;line-height:1;transform:translateY(.12em)}
  .sqrt.cbrt::before{content:"∛"}
  .sqrt>span.rad{display:inline-block;border-top:1.6px solid currentColor;padding:0 .1em 0 .05em;margin-left:1px}
  .sqrt .ix{order:-1;align-self:flex-start;font-size:.52em;font-weight:700;line-height:1;margin:0 -.2em 0 0;transform:translateY(.05em)}

  @media print{
    header{background:none!important; color:var(--tekst)!important; padding:0 0 10px}
    .juosta, .grizti, .mygtukai{display:none!important}
    .sprendimas{display:none!important}
    .uzd input[type=text]{border:1.5px solid #888; background:#fff}
    .grupe{box-shadow:none; border:1px solid #bbb; break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="antraste">Laipsnio su natūraliuoju rodikliu savybės</h1>
    <p id="paantraste">7 klasė · Laipsniai · įrašyk atsakymus ir tikrinkis. Paspaudus Nauji skaičiai, užduotys sugeneruojamos iš naujo.</p>
  </header>
  <div class="korpusas">
    <a class="grizti" id="grizti" href="../" style="display:none">← Atgal į temą</a>

    <div class="juosta">
      <span class="busena" id="busena">Paspausk „Patikrinti atsakymus", kai užpildysi.</span>
      <div class="mygtukai">
        <button class="btn btn-p" id="tikrinti">Patikrinti atsakymus</button>
        <button class="btn btn-a" id="nauji">Nauji skaičiai ↻</button>
        <button class="btn btn-a" id="spausdinti">Spausdinti</button>
      </div>
    </div>
    <p class="pastabos" id="pastabos"></p>

    <div id="grupes"></div>

    <footer id="poraste">Mokytoja Violeta</footer>
  </div>
</div>

<script>
// === GEN START ===
// --- Bendri pagalbininkai (naudoja visi generatoriai) ---
function randint(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function nz(a,b){ let n=0; do{ n=randint(a,b); }while(n===0); return n; } // ne nulis
function nf(n){ n=Math.round(n*1000)/1000; const s=Math.abs(n).toString().replace('.',','); return (n<0?'−':'')+s; }
function pm(n){ n=Math.round(n*1000)/1000; const s=Math.abs(n).toString().replace('.',','); return (n<0?'− ':'+ ')+s; }

// --- Temos generatoriai (įkeliami builder'io) ---
// 7 kl. 2.2 Laipsnis su natūraliuoju rodikliu — treniruoklio-generacija
// Šablonas apibrėžia: randint(a,b), choice(arr), nz(a,b), nf(n), pm(n) — ČIA jų NEapibrėžiam.

function powExpr(base, exp){
  // neigiama bazė visada skliaustuose: (−2)^6, ne −2^6 (dviprasmybe be skliaustu)
  const baseStr = (typeof base === 'number' && base < 0) ? `(${nf(base)})` : String(base);
  return `${baseStr}^${exp}`;
}

const GENERATORIAI = [
  // 1a. Sandauga (tas pats pagrindas)
  { label:"Laipsnių savybės",
    note:"Kiekvieną reiškinį apskaičiuok arba užrašyk vienu laipsniu.", gen(){
      const p = choice([2,3,5,7,11,-2,-3,-5]);
      const m = randint(1,9), n = randint(1,9);
      const exp = m+n;
      const ans = powExpr(p, exp);
      return { q: `${powExpr(p,m)} · ${powExpr(p,n)} =`, ans, ansType:'text', ansAlt:[String(Math.pow(p,exp))],
        steps:[`Rodikliai sudedami: ${m} + ${n} = ${exp}`, `= ${ans}`] };
  }},
  // 1b. Dalyba (tas pats pagrindas, m ≥ n)
  { label:"Laipsnių savybės", gen(){
      const p = choice([2,3,5,7,11,-2,-3,-5]);
      const m = randint(2,12), n = randint(1,m);
      const exp = m-n;
      const ans = exp === 0 ? '1' : powExpr(p, exp);
      return { q: `${powExpr(p,m)} : ${powExpr(p,n)} =`, ans, ansType:'text', ansAlt:[String(Math.pow(p,exp))],
        steps:[`Rodikliai atimami: ${m} − ${n} = ${exp}`, `= ${ans}`] };
  }},
  // 1c. Laipsnis keliamas laipsniu
  { label:"Laipsnių savybės", gen(){
      const p = choice([2,3,5,7,11,12,-2,-3]);
      const m = randint(1,5), n = randint(1,4);
      const exp = m*n;
      const ans = powExpr(p, exp);
      return { q:`(${powExpr(p,m)})^${n} =`, ans, ansType:'text', ansAlt:[String(Math.pow(p,exp))],
        steps:[`(${powExpr(p,m)})^${n} = ${powExpr(p, m*n)}`, `= ${ans}`] };
  }},
  // 1d. Sandaugos laipsnis: p^n · q^n = (p·q)^n
  { label:"Laipsnių savybės", gen(){
      const n = randint(1,5);
      let p = randint(2,12), q = randint(2,12);
      while(q === p) q = randint(2,12);
      const pq = p*q;
      const ans = powExpr(pq, n);
      return { q:`${powExpr(p,n)} · ${powExpr(q,n)} =`, ans, ansType:'text', ansAlt:[String(Math.pow(pq,n))],
        steps:[`${p} · ${q} = ${pq}, rodiklis lieka tas pats`, `= ${ans}`] };
  }},
  // 1e. Dalmens laipsnis: p^n : q^n = (p:q)^n
  { label:"Laipsnių savybės", gen(){
      const n = randint(1,5);
      const q = randint(2,9), k = randint(2,9);
      const p = q*k;
      const ans = powExpr(k, n);
      return { q:`${powExpr(p,n)} : ${powExpr(q,n)} =`, ans, ansType:'text', ansAlt:[String(Math.pow(k,n))],
        steps:[`${p} : ${q} = ${k}, rodiklis lieka tas pats`, `= ${ans}`] };
  }},
  // 2. Trijų dauginamųjų sandauga
  { label:"Trijų dauginamųjų sandauga", note:"Sandaugą užrašykite vienu laipsniu.", gen(){
      const p = choice([2,3,5,7,-2,-3,-5,-7,-9]);
      const m = randint(1,7), n = randint(1,7), o = randint(1,7);
      const exp = m+n+o;
      const ans = powExpr(p, exp);
      return { q:`${powExpr(p,m)} · ${powExpr(p,n)} · ${powExpr(p,o)} =`, ans, ansType:'text', ansAlt:[String(Math.pow(p,exp))],
        steps:[`Rodikliai sudedami: ${m} + ${n} + ${o} = ${exp}`, `= ${ans}`] };
  }},
  // 3. Raidinis pagrindas
  { label:"Raidinis pagrindas", note:"Reiškinį užrašykite laipsniu.", gen(){
      const letter = choice(['a','b','x','m','n']);
      const op = choice(['*','/']);
      let q, ans, exp;
      if(op === '*'){
        const m = randint(1,9), n = randint(1,9);
        exp = m+n;
        q = `${powExpr(letter,m)} · ${powExpr(letter,n)}`;
      } else {
        const m = randint(2,12), n = randint(1,m);
        exp = m-n;
        q = `${powExpr(letter,m)} : ${powExpr(letter,n)}`;
      }
      ans = exp === 0 ? '1' : powExpr(letter, exp);
      return { q: `${q} =`, ans, ansType:'text',
        steps:[`${op==='*'?'Rodikliai sudedami':'Rodikliai atimami'}, rezultato rodiklis = ${exp}`, `= ${ans}`] };
  }},
  // 4. Apskaičiuokite (skaitinė reikšmė)
  { label:"Apskaičiuokite", note:"Apskaičiuokite reiškinio reikšmę.", gen(){
      const p = choice([2,3,5]);
      const op = choice(['*','/']);
      let q, exp;
      if(op === '*'){
        const m = randint(1,5), n = randint(1,5);
        exp = m+n;
        q = `${powExpr(p,m)} · ${powExpr(p,n)}`;
      } else {
        const m = randint(2,8), n = randint(1,m);
        exp = m-n;
        q = `${powExpr(p,m)} : ${powExpr(p,n)}`;
      }
      const ansVal = Math.pow(p, exp);
      return { q:`${q} =`, ans: ansVal,
        steps:[`= ${powExpr(p, exp)}`, `= ${ansVal}`] };
  }},
  // 5. Užrašykite laipsniu, kurio pagrindas 2, 3 arba 5
  { label:"Užrašykite laipsniu, kurio pagrindas 2, 3 arba 5",
    note:"Duotą skaičių pakeiskite nurodyto pagrindo laipsniu, tada sandaugą užrašykite vienu laipsniu.", gen(){
      const r = choice([2,3,5]);
      const k1max = r === 2 ? 10 : (r === 3 ? 6 : 5);
      const k1 = randint(2, k1max), n2 = randint(1, 6);
      const N = Math.pow(r, k1);
      const ans = powExpr(r, k1+n2);
      return { q:`${N} · ${powExpr(r,n2)} =`, ans, ansType:'text', ansAlt:[String(Math.pow(r,k1+n2))],
        steps:[`${N} = ${powExpr(r,k1)}`, `${powExpr(r,k1)} · ${powExpr(r,n2)} = ${ans}`] };
  }}
];


// naudoja verify_gen.mjs (atsitiktinis vienas uždavinys patikrai) — pagrindinis puslapis
// generuoja VISUS GENERATORIAI narius vienu metu (žr. sugeneruoti() žemiau), ne šitą.
function makeProblem(){
  const g = choice(GENERATORIAI);
  const p = g.gen();
  p.label = g.label;
  return p;
}
// === GEN END ===

const META = {"title": "Laipsnio su natūraliuoju rodikliu savybės", "subtitle": "7 klasė · Laipsniai · įrašyk atsakymus ir tikrinkis. Paspaudus Nauji skaičiai, užduotys sugeneruojamos iš naujo.", "pastabos": "Atsakymuose galima rašyti kablelį arba tašką. Laipsnius rašyk kaip 3^5.", "poraste": "Mokytoja Violeta", "grizti": "../"};
const $ = id => document.getElementById(id);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMath(s){
  if(/<svg[\s>]/i.test(s)) return s;
  let out = esc(s)
    .replace(/\^\(([^)]+)\)/g, '<sup>$1</sup>')
    .replace(/\^(-?\d+)/g, '<sup>$1</sup>')
    .replace(/\^([▢□])/g, '<sup>$1</sup>')
    .replace(/([A-Za-z0-9])([▢□])/g, '$1<sup>$2</sup>')
    .replace(/(\d+)\/(\d+|[▢□])/g, '<span class="fr"><span>$1</span><span>$2</span></span>');
  let prev;
  do {
    prev = out;
    out = out.replace(/\{sqrt:([^{}]*)\}/g,'<span class="sqrt"><span class="rad">$1</span></span>');
    out = out.replace(/\{cbrt:([^{}]*)\}/g,'<span class="sqrt cbrt"><span class="rad">$1</span></span>');
    out = out.replace(/\{root:([^|{}]*)\|([^{}]*)\}/g,'<span class="sqrt"><span class="ix">$1</span><span class="rad">$2</span></span>');
  } while(out !== prev);
  return out;
}

// Priima sveikuosius, dešimtainius (kablelį ar tašką) ir trupmenas „a/b".
function parseVal(s){
  s = (s||'').trim().replace(/\s/g,'').replace(/−/g,'-').replace(',', '.');
  if(s==='') return NaN;
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){ const d=parseFloat(m[2]); if(d===0) return NaN; return parseFloat(m[1])/d; }
  return parseFloat(s);
}
function atsTekstas(p){ return p.ansText || (p.ansType==='text' ? p.ans : nf(p.ans)); }
function normText(s){
  return (s||'').toString().trim().toLowerCase()
    .replace(/\s+/g,'')
    .replace(/-/g,'−')
    .replace(/<=/g,'≤').replace(/=</g,'≤')
    .replace(/>=/g,'≥').replace(/=>/g,'≥')
    .replace(/infinity|inf\b/g,'∞');
}
function teisingas(p, raw){
  if(p.ansType === 'text'){
    if(!raw.trim()) return null;
    const accepted = [p.ans, ...(p.ansAlt||[])].map(normText);
    return accepted.includes(normText(raw));
  }
  const val = parseVal(raw);
  if(isNaN(val)) return null;
  return Math.abs(val - p.ans) < 1e-6;
}

// ---- Grupavimas: is eiles einantys generatoriai su tuo paciu "label" sudaro viena korta ----
let PROBLEMS = []; // [{...gen() rezultatas, label, idx}]

function sugeneruoti(){
  PROBLEMS = GENERATORIAI.map((g,i)=>{
    const p = g.gen();
    p.label = g.label;
    p.note = g.note || null;
    p.idx = i;
    return p;
  });
}

function pieshti(){
  const cont = $('grupes');
  cont.innerHTML = '';
  let i = 0, grupesSk = 0;
  while(i < PROBLEMS.length){
    const label = PROBLEMS[i].label;
    const grupe = [];
    while(i < PROBLEMS.length && PROBLEMS[i].label === label){ grupe.push(PROBLEMS[i]); i++; }
    grupesSk++;
    const div = document.createElement('div');
    div.className = 'grupe';
    const antraste = /^\s*\d/.test(label) ? label : `${grupesSk}. ${label}`;
    let html = `<h2>${esc(antraste)}</h2>`;
    if(grupe[0].note) html += `<p class="nuoroda">${esc(grupe[0].note)}</p>`;
    grupe.forEach(p=>{
      const simbHtml = SIMBOLIAI.map(s=>`<button type="button" class="simb" data-target="at${p.idx}" data-ch="${esc(s)}">${esc(s)}</button>`).join('');
      html += `<div class="uzd" data-idx="${p.idx}">
        <span class="klaus">${fmtMath(p.q)}</span>
        <div class="ivedimas">
          <input type="text" id="at${p.idx}" autocomplete="off" inputmode="text" placeholder="?">
          <div class="simb-row">${simbHtml}</div>
        </div>
        <span class="zenklas" id="zn${p.idx}"></span>
        <div class="sprendimas" id="sp${p.idx}"></div>
      </div>`;
    });
    div.innerHTML = html;
    cont.appendChild(div);
  }
}

function naujiSkaiciai(){
  sugeneruoti();
  pieshti();
  $('busena').className = 'busena';
  $('busena').textContent = 'Naujas variantas paruoštas. Sėkmės!';
}

function patikrinti(){
  let correct = 0, answered = 0;
  PROBLEMS.forEach(p=>{
    const inp = $('at'+p.idx);
    const ok = teisingas(p, inp.value);
    const zn = $('zn'+p.idx);
    const sp = $('sp'+p.idx);
    inp.classList.remove('ok','ne');
    if(ok === null){ zn.textContent=''; sp.style.display='none'; return; }
    answered++;
    if(ok){ correct++; inp.classList.add('ok'); zn.textContent='✓'; }
    else{ inp.classList.add('ne'); zn.textContent='✗'; }
    if(sp){
      const steps = (p.steps||[]).map(s=>fmtMath(s)).join(' → ');
      if(ok && !steps){
        sp.innerHTML = '';
        sp.style.display = 'none';
      } else {
        sp.innerHTML = ok
          ? `<b>Sprendimas:</b> ${steps}`
          : `<b>Teisingas atsakymas:</b> ${fmtMath(atsTekstas(p))}` + (steps ? ` — <b>sprendimas:</b> ${steps}` : '');
        sp.style.display = 'block';
      }
    }
  });
  const total = PROBLEMS.length;
  const b = $('busena');
  if(answered < total){
    b.className = 'busena';
    b.textContent = `Liko neatsakyta: ${total-answered}. Patikrink, ar visi laukai užpildyti.`;
    return;
  }
  b.className = 'busena ' + (correct===total ? 'ok' : (correct===0 ? 'ne' : ''));
  b.textContent = `Teisingai: ${correct} iš ${total}.` + (correct===total ? ' Puiku!' : '');
}

const SIMBOLIAI = (META.simboliai && META.simboliai.length) ? META.simboliai : ['^','(',')','/','+','−',','];

function insSymbol(inputId, ch){
  const el = document.getElementById(inputId);
  if(!el) return;
  const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,s) + ch + el.value.slice(e);
  const pos = s + ch.length;
  el.focus();
  el.setSelectionRange(pos,pos);
}
$('grupes').addEventListener('click', e=>{
  const b = e.target.closest('.simb');
  if(!b) return;
  insSymbol(b.dataset.target, b.dataset.ch);
});

$('tikrinti').addEventListener('click', patikrinti);
$('nauji').addEventListener('click', naujiSkaiciai);
$('spausdinti').addEventListener('click', ()=>window.print());

$('antraste').textContent = META.title || 'Treniruoklis';
$('paantraste').textContent = META.subtitle || '';
document.title = META.title || 'Treniruoklis';
$('pastabos').textContent = META.pastabos || 'Atsakymuose galima rašyti kablelį arba tašką.';
if(META.grizti){ $('grizti').href = META.grizti; $('grizti').style.display=''; }
if(META.poraste) $('poraste').textContent = META.poraste;

naujiSkaiciai();
</script>
</body>
</html>
