<!doctype html><html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spausdinamas testas · 5 klasės kartojimas — testas 1</title>
<style>
  :root{--tema:#b25c00;--tema-t:#c96f0d;--pilka:#5b6472;--bg:#eef2f7;--kort:#fff;--tekst:#1c2430;--linija:#d8dee6}
  @media (prefers-color-scheme:dark){:root{--bg:#131720;--kort:#1c2230;--tekst:#e7ecf3;--linija:#2c3648;--pilka:#9aa6b6}}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tekst);min-height:100vh;padding:38px 16px 54px}
  .wrap{max-width:760px;margin:0 auto}
  header{text-align:center;margin-bottom:20px}
  h1{font-size:22px;color:var(--tema-t);margin:0 0 6px}
  .sub{font-size:14px;color:var(--pilka);margin:0}
  .grizti{display:inline-block;margin:10px 0 0;color:var(--tema-t);font-size:13px;text-decoration:none}
  .grizti:hover{text-decoration:underline}
  .btn{display:inline-block;margin:14px 0 22px;background:var(--tema);color:#fff;text-decoration:none;
       padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px}
  .btn:hover{background:var(--tema-t)}
  .frame-wrap{background:var(--kort);border:1px solid var(--linija);border-radius:14px;overflow:hidden;
              box-shadow:0 3px 14px rgba(0,0,0,.07)}
  iframe{width:100%;height:80vh;border:0;display:block}
  footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--pilka)}
</style></head><body>
<div class="wrap">
<header>
  <h1>📄 Spausdinamas testas</h1>
  <p class="sub">5 klasės kartojimas — testas 1 · 6 klasė · 4 variantai + atsakymų raktas</p>

</header>
<div style="text-align:center"><a class="btn" href="spausdinamas-testas.pdf" download>⬇ Atsisiųsti PDF</a></div>
<div class="frame-wrap"><iframe src="spausdinamas-testas.pdf" title="Spausdinamas testas PDF"></iframe></div>
<footer>Mokytoja Violeta · 5 klasės kartojimas</footer>
</div>
</body></html>
