<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vienanaris ir daugianaris</title>
<style>
  :root{
    --bg:#eef2f7; --kort:#fff; --tekst:#1c2430; --pilka:#5b6472; --linija:#d8dee6;
    --tema:#1e5fa8; --tema-t:#2b74c4; --ok:#1e7e34; --ok-f:#eaf6ec; --ne:#b91c1c; --ne-f:#fdecec;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#131720; --kort:#1c2230; --tekst:#e7ecf3; --pilka:#9aa6b6; --linija:#2c3648;
      --ok-f:#113322; --ne-f:#3a1414;}
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--tekst); font-family:"Segoe UI",system-ui,sans-serif;
    line-height:1.5; font-size:16px;}
  .wrap{max-width:760px; margin:0 auto; padding:0 0 60px}
  header{background:linear-gradient(135deg,var(--tema),var(--tema-t)); color:#fff; padding:34px 24px 28px}
  header h1{font-size:28px; margin:0 0 10px}
  header p{margin:0; font-size:14.5px; opacity:.95; max-width:640px}
  .korpusas{padding:20px 20px 0}
  .grizti{display:inline-block; margin:16px 0 0; color:var(--tema-t); font-size:13px; text-decoration:none}
  .grizti:hover{text-decoration:underline}

  .juosta{background:var(--kort); border:1px solid var(--linija); border-radius:14px;
    padding:14px 18px; margin:16px 0; display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; box-shadow:0 3px 14px rgba(0,0,0,.06)}
  .busena{font-weight:600; font-size:14.5px}
  .busena.ok{color:var(--ok)} .busena.ne{color:var(--ne)}
  .mygtukai{display:flex; gap:8px; flex-wrap:wrap}
  .btn{border:none; border-radius:10px; padding:11px 18px; font-size:14.5px; font-weight:600;
    cursor:pointer; font-family:inherit; white-space:nowrap}
  .btn-p{background:var(--tema); color:#fff}
  .btn-a{background:var(--linija); color:var(--tekst)}
  .btn:active{transform:translateY(1px)}

  .pastabos{font-size:12.5px; color:var(--pilka); margin:0 0 18px; line-height:1.6}

  .dalies{background:linear-gradient(135deg,var(--tema),var(--tema-t)); color:#fff; padding:10px 18px;
    border-radius:12px; font-size:15px; font-weight:700; margin:22px 0 10px; letter-spacing:.2px}

  .grupe{background:var(--kort); border:1px solid var(--linija); border-radius:14px;
    padding:18px 20px; margin-bottom:16px; box-shadow:0 3px 14px rgba(0,0,0,.05)}
  .grupe h2{font-size:17px; margin:0 0 4px; color:var(--tema-t)}
  .grupe .nuoroda{font-size:13.5px; color:var(--pilka); margin:0 0 14px}
  .uzd{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:9px 0;
    border-top:1px solid var(--linija)}
  .uzd:first-of-type{border-top:none}
  .uzd .klaus{font-size:17px; flex:1 1 220px; min-width:200px; line-height:1.6}
  .uzd input[type=text]{font-size:17px; width:170px; padding:7px 10px; text-align:center;
    border:2px solid var(--linija); border-radius:9px; font-family:inherit; background:var(--kort); color:var(--tekst)}
  .uzd input[type=text]:focus{outline:none; border-color:var(--tema)}
  .uzd input[type=text].ok{border-color:var(--ok); background:var(--ok-f)}
  .uzd input[type=text].ne{border-color:var(--ne); background:var(--ne-f)}
  .zenklas{font-size:19px; width:22px; text-align:center}
  .ivedimas{display:flex; flex-direction:column; gap:4px; align-items:center}
  .simb-row{display:flex; gap:3px}
  .simb-row button{border:1px solid var(--linija); background:var(--bg); color:var(--tekst);
    border-radius:6px; width:24px; height:24px; font-size:13px; line-height:1; cursor:pointer;
    padding:0; font-family:inherit}
  .simb-row button:hover{background:var(--linija)}
  @media print{ .ivedimas .simb-row{display:none!important} }
  .sprendimas{flex-basis:100%; font-size:13.5px; color:var(--pilka); background:var(--bg);
    border-radius:8px; padding:8px 12px; margin-top:4px; display:none}
  .sprendimas b{color:var(--tekst)}

  footer{text-align:center; margin-top:24px; font-size:12.5px; color:var(--pilka); padding-bottom:10px}

  @media print{
    header{background:none!important; color:var(--tekst)!important; padding:0 0 10px}
    .juosta, .grizti, .mygtukai{display:none!important}
    .sprendimas{display:none!important}
    .uzd input[type=text]{border:1.5px solid #888; background:#fff}
    .grupe{box-shadow:none; border:1px solid #bbb; break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="antraste">Vienanaris ir daugianaris</h1>
    <p id="paantraste">8 klasė · 4 skyrius „Reiškiniai“ · 4.1 tema · įrašyk atsakymus ir tikrinkis.</p>
  </header>
  <div class="korpusas">
    <a class="grizti" id="grizti" href="../" style="display:none">← Atgal į temą</a>

    <div class="juosta">
      <span class="busena" id="busena">Paspausk „Patikrinti atsakymus", kai užpildysi.</span>
      <div class="mygtukai">
        <button class="btn btn-p" id="tikrinti">Patikrinti atsakymus</button>
        <button class="btn btn-a" id="nauji">Nauji skaičiai ↻</button>
        <button class="btn btn-a" id="spausdinti">Spausdinti</button>
      </div>
    </div>
    <p class="pastabos" id="pastabos"></p>

    <div id="grupes"></div>

    <footer id="poraste">Mokytoja Violeta</footer>
  </div>
</div>

<script>
// === GEN START ===
function randint(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function scoef(min,max){ return choice([1,-1]) * randint(min,max); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=randint(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick2(arr){ const a=choice(arr); let b=choice(arr); while(b===a) b=choice(arr); return [a,b]; }
function nfInt(n){ return n<0 ? '−'+Math.abs(n) : String(n); }

const SUP = {0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶'};
function supNum(n){ return SUP[n] !== undefined ? SUP[n] : ('^'+n); }

// --- Vienanarių ir daugianarių konstravimo pagalbininkai ---
// vienanaris reprezentuojamas {coef:Number, vars:{raidė:laipsnis,...}}
function varPartStr(vars){
  return Object.keys(vars).sort().filter(k=>vars[k]).map(k=> vars[k]===1 ? k : k+supNum(vars[k])).join('');
}
function monoStr(coef, vars){
  const vp = varPartStr(vars);
  if(coef === 0) return '0';
  const absC = Math.abs(coef);
  const body = (absC === 1 && vp) ? vp : (String(absC) + vp);
  return (coef < 0 ? '−' : '') + body;
}
function termStr(coef, vars, isFirst){
  const vp = varPartStr(vars);
  const absC = Math.abs(coef);
  const body = (absC === 1 && vp) ? vp : (String(absC) + vp);
  if(isFirst) return (coef < 0 ? '−' : '') + body;
  return (coef < 0 ? ' − ' : ' + ') + body;
}
function exprFromTerms(terms){
  const nzTerms = terms.filter(t => t.coef !== 0);
  if(!nzTerms.length) return '0';
  return nzTerms.map((t,i) => termStr(t.coef, t.vars, i === 0)).join('');
}
function sigOf(vars){ return Object.keys(vars).sort().map(k=>k+':'+vars[k]).join(','); }
function combineLike(terms){
  const map = new Map(); const order = [];
  terms.forEach(t=>{
    const sig = sigOf(t.vars);
    if(!map.has(sig)){ map.set(sig, {coef:0, vars:t.vars}); order.push(sig); }
    map.get(sig).coef += t.coef;
  });
  return order.map(sig=>map.get(sig));
}
function mulVars(v1,v2){
  const out = Object.assign({}, v1);
  for(const k in v2) out[k] = (out[k]||0) + v2[k];
  return out;
}
function mulMono(m1,m2){ return { coef: m1.coef*m2.coef, vars: mulVars(m1.vars, m2.vars) }; }
function randExpr2(v1,v2,maxE){
  let e1 = randint(0,maxE), e2 = randint(0,maxE);
  if(e1===0 && e2===0) e1 = randint(1,maxE);
  const vars = {};
  if(e1>0) vars[v1]=e1;
  if(e2>0) vars[v2]=e2;
  return vars;
}
function termSingle(coef, v){ return termStr(coef, {[v]:1}, true); }

const VARS = ['x','y','a','b','m','n','p','q'];
const LETTERS = ['A','B','C','D'];

// === 8 kl. 4.1 tema · Vienanaris ir daugianaris ===

function genVienanarisAtpazinimas(){
  const v = choice(VARS);
  const c1 = randint(2,9), c2 = randint(2,9), c3 = randint(2,9);
  const monoDiv = `${c1}${v} : ${c2}`;
  const monoMul = `${c2}${v} · ${c1}`;
  const expN = randint(2,5);
  const monoPow = `${v}${supNum(expN)}`;
  const nonMono = `${c3}${v} + ${c1}`;
  const opts = shuffle([monoDiv, monoMul, monoPow, nonMono]);
  const idx = opts.indexOf(nonMono);
  const q = `Kuris iš duotų reiškinių NĖRA vienanaris? Įrašyk raidę (A, B, C ar D).{br}` +
    opts.map((o,i)=>`${LETTERS[i]}) ${o}`).join('{br}');
  return {
    q, ansType:'text', ans: LETTERS[idx],
    steps: [
      `Vienanaris — tai skaičiaus, kintamojo ar jų laipsnių sandauga (taip pat ir dalyba iš skaičiaus).`,
      `${nonMono} yra dviejų narių suma (dvinaris), todėl jis NĖRA vienanaris.`,
      `Atsakymas: ${LETTERS[idx]}`
    ]
  };
}

function genDidziausiasKoeficientas(){
  const v = choice(VARS);
  const used = new Set(); const coefs = [];
  while(coefs.length<4){ const c = scoef(2,9); if(!used.has(c)){ used.add(c); coefs.push(c); } }
  const display = shuffle(coefs);
  const maxVal = Math.max(...coefs);
  const idx = display.indexOf(maxVal);
  const q = `Kurio vienanario koeficientas yra didžiausias? Įrašyk raidę.{br}` +
    display.map((c,i)=>`${LETTERS[i]}) ${termSingle(c,v)}`).join('{br}');
  return { q, ansType:'text', ans: LETTERS[idx],
    steps: [`Palyginame koeficientus: ${display.map(c=>nfInt(c)).join(', ')}.`,
            `Didžiausias yra ${nfInt(maxVal)} — tai ${LETTERS[idx]} variantas.`] };
}

function genSutraukimasSingle(){
  const v = choice(VARS);
  const exp = choice([1,2]);
  const vars = {[v]: exp};
  const c1 = scoef(3,15), c2 = scoef(3,15), c3 = scoef(3,15);
  const terms = [{coef:c1,vars},{coef:c2,vars},{coef:c3,vars}];
  const q = `Sutraukite panašiuosius narius: ${exprFromTerms(terms)}.`;
  const combined = combineLike(terms);
  const ans = exprFromTerms(combined);
  return { q, ansType:'text', ans,
    steps: [`Visi trys nariai turi tą pačią raidinę dalį (${varPartStr(vars)}).`,
            `Sudedame koeficientus: ${nfInt(c1)} ${c2<0?'−':'+'} ${Math.abs(c2)} ${c3<0?'−':'+'} ${Math.abs(c3)} = ${nfInt(c1+c2+c3)}.`,
            `= ${ans}`] };
}

function genSutraukimasMixed(){
  const [v1,v2] = pick2(VARS);
  const exp = choice([1,2]);
  const varsA = {[v1]:exp}, varsB = {[v2]:exp};
  const c1 = scoef(2,9), c2 = scoef(2,9);
  const d1 = scoef(2,9), d2 = scoef(2,9);
  const terms = [{coef:d1,vars:varsB},{coef:c1,vars:varsA},{coef:d2,vars:varsB},{coef:c2,vars:varsA}];
  const q = `Sutraukite panašiuosius narius: ${exprFromTerms(terms)}.`;
  let combined = combineLike(terms);
  combined.sort((x,y)=> Object.keys(x.vars)[0].localeCompare(Object.keys(y.vars)[0]));
  const ans = exprFromTerms(combined);
  return { q, ansType:'text', ans,
    steps: [`Sugrupuojame narius su ta pačia raidine dalimi: atskirai ${v1}, atskirai ${v2}.`,
            `Sudedame kiekvienos grupės koeficientus atskirai.`,
            `= ${ans}`] };
}

function genVienanariuSandauga(){
  const [v1,v2] = pick2(VARS);
  const m1vars = randExpr2(v1,v2,2);
  const m2vars = randExpr2(v1,v2,2);
  const c1 = scoef(2,9), c2 = scoef(2,9);
  const prodVars = mulVars(m1vars,m2vars);
  const coef = c1*c2;
  const m1Str = monoStr(c1, m1vars);
  const m2StrRaw = monoStr(c2, m2vars);
  const m2Str = c2<0 ? `(${m2StrRaw})` : m2StrRaw;
  const q = `Vienanarių sandaugą užrašykite standartinio pavidalo vienanariu: ${m1Str} · ${m2Str}.`;
  const ans = monoStr(coef, prodVars);
  return { q, ansType:'text', ans,
    steps: [`Sudauginame koeficientus: ${nfInt(c1)} · (${nfInt(c2)}) = ${nfInt(coef)}.`,
            `Tos pačios raidės laipsnius sudedame (pvz. ${v1}ᵐ·${v1}ⁿ = ${v1}ᵐ⁺ⁿ).`,
            `= ${ans}`] };
}

function pickDistinctShapes(v1,v2){
  const shapes = [{}, {[v1]:1}, {[v2]:1}];
  const i = randint(0,2);
  let j = randint(0,2);
  while(j===i) j = randint(0,2);
  return [shapes[i], shapes[j]];
}

function genDvinarisDauginti(){
  const [v1,v2] = pick2(VARS);
  const monoVars = randExpr2(v1,v2,1);
  const coefM = scoef(2,9);
  const [t1vars,t2vars] = pickDistinctShapes(v1,v2);
  const t1 = {coef:scoef(2,9), vars: t1vars};
  const t2 = {coef:scoef(2,9), vars: t2vars};
  const binomialTerms = [t1,t2];
  const binomialStr = exprFromTerms(binomialTerms);
  const monoDisplay = monoStr(coefM, monoVars);
  const before = choice([true,false]);
  let q;
  if(before){
    q = `Dvinarį padauginkite iš vienanario: ${monoDisplay}·(${binomialStr}).`;
  } else {
    const monoWrapped = coefM<0 ? `(${monoDisplay})` : monoDisplay;
    q = `Dvinarį padauginkite iš vienanario: (${binomialStr})·${monoWrapped}.`;
  }
  const resultTermsRaw = binomialTerms.map(t=>({coef: coefM*t.coef, vars: mulVars(monoVars, t.vars)}));
  const resultTerms = combineLike(resultTermsRaw);
  const ans = exprFromTerms(resultTerms);
  return { q, ansType:'text', ans,
    steps: [`Kiekvieną dvinario narį dauginame iš vienanario ${monoDisplay}.`,
            `${monoDisplay}·${monoStr(t1.coef,t1.vars)} = ${monoStr(resultTermsRaw[0].coef, resultTermsRaw[0].vars)}`,
            `${monoDisplay}·${t2.coef<0?`(${monoStr(t2.coef,t2.vars)})`:monoStr(t2.coef,t2.vars)} = ${monoStr(resultTermsRaw[1].coef, resultTermsRaw[1].vars)}`,
            `= ${ans}`] };
}

const GENERATORIAI = [
  { label:"Ar vienanaris? Koeficientas", gen: genVienanarisAtpazinimas },
  { label:"Ar vienanaris? Koeficientas", gen: genDidziausiasKoeficientas },

  { label:"Sutraukite panašiuosius narius", gen: genSutraukimasSingle },
  { label:"Sutraukite panašiuosius narius", gen: genSutraukimasSingle },
  { label:"Sutraukite panašiuosius narius", gen: genSutraukimasMixed },
  { label:"Sutraukite panašiuosius narius", gen: genSutraukimasMixed },

  { label:"Vienanarių sandauga standartiniu pavidalu", gen: genVienanariuSandauga },
  { label:"Vienanarių sandauga standartiniu pavidalu", gen: genVienanariuSandauga },
  { label:"Vienanarių sandauga standartiniu pavidalu", gen: genVienanariuSandauga },
  { label:"Vienanarių sandauga standartiniu pavidalu", gen: genVienanariuSandauga },

  { label:"Dvinarį padauginkite iš vienanario", gen: genDvinarisDauginti },
  { label:"Dvinarį padauginkite iš vienanario", gen: genDvinarisDauginti },
  { label:"Dvinarį padauginkite iš vienanario", gen: genDvinarisDauginti },
  { label:"Dvinarį padauginkite iš vienanario", gen: genDvinarisDauginti },
];

function makeProblem(){
  const g = choice(GENERATORIAI);
  const p = g.gen();
  p.label = g.label;
  return p;
}
// === GEN END ===

const META = {"title": "Vienanaris ir daugianaris", "subtitle": "8 klasė · 4 skyrius „Reiškiniai“ · 4.1 tema · įrašyk atsakymus ir tikrinkis. Paspaudus „Nauji skaičiai“, užduotys sugeneruojamos iš naujo.", "pastabos": "Atsakymuose rašyk reiškinį be tarpų, pvz. 6x² (priimama ir 6x^2). Neigiamą skaičių gali žymėti paprastu brūkšneliu. MC klausimuose įrašyk tik raidę (A, B, C ar D).", "poraste": "Mokytoja Violeta", "simboliai": ["²","³","−",","]};
const $ = id => document.getElementById(id);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMath(s){
  if(/<svg[\s>]/i.test(s)) return s;
  let out = esc(s)
    .replace(/\^\(([^)]+)\)/g, '<sup>$1</sup>')
    .replace(/\^(-?\d+)/g, '<sup>$1</sup>')
    .replace(/(\d+)\/(\d+)/g, '<span class="fr"><span>$1</span><span>$2</span></span>')
    .replace(/\{br\}/g, '<br>');
  return out;
}

function parseVal(s){
  s = (s||'').trim().replace(/\s/g,'').replace(/−/g,'-').replace(',', '.');
  if(s==='') return NaN;
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){ const d=parseFloat(m[2]); if(d===0) return NaN; return parseFloat(m[1])/d; }
  return parseFloat(s);
}
function atsTekstas(p){ return p.ansText || (p.ansType==='text' ? p.ans : nfInt(p.ans)); }
function normText(s){
  return (s||'').toString().trim().toLowerCase()
    .replace(/\s+/g,'')
    .replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/\^4/g,'⁴')
    .replace(/-/g,'−')
    .replace(/<=/g,'≤').replace(/=</g,'≤')
    .replace(/>=/g,'≥').replace(/=>/g,'≥')
    .replace(/infinity|inf\b/g,'∞');
}
function teisingas(p, raw){
  if(p.ansType === 'text'){
    if(!raw.trim()) return null;
    const accepted = [p.ans, ...(p.ansAlt||[])].map(normText);
    return accepted.includes(normText(raw));
  }
  const val = parseVal(raw);
  if(isNaN(val)) return null;
  return Math.abs(val - p.ans) < 1e-6;
}

let PROBLEMS = [];

function sugeneruoti(){
  PROBLEMS = GENERATORIAI.map((g,i)=>{
    const p = g.gen();
    p.label = g.label;
    p.part = g.part || null;
    p.note = g.note || null;
    p.idx = i;
    return p;
  });
}

function pieshti(){
  const cont = $('grupes');
  cont.innerHTML = '';
  let i = 0, grupesSk = 0;
  while(i < PROBLEMS.length){
    const label = PROBLEMS[i].label;
    if(PROBLEMS[i].part){
      const h = document.createElement('div');
      h.className = 'dalies';
      h.textContent = PROBLEMS[i].part;
      cont.appendChild(h);
    }
    const grupe = [];
    while(i < PROBLEMS.length && PROBLEMS[i].label === label){ grupe.push(PROBLEMS[i]); i++; }
    grupesSk++;
    const div = document.createElement('div');
    div.className = 'grupe';
    const antraste = /^\s*\d/.test(label) ? label : `${grupesSk}. ${label}`;
    let html = `<h2>${esc(antraste)}</h2>`;
    if(grupe[0].note) html += `<p class="nuoroda">${esc(grupe[0].note)}</p>`;
    grupe.forEach(p=>{
      const simbHtml = SIMBOLIAI.map(s=>`<button type="button" class="simb" data-target="at${p.idx}" data-ch="${esc(s)}">${esc(s)}</button>`).join('');
      html += `<div class="uzd" data-idx="${p.idx}">
        <span class="klaus">${fmtMath(p.q)}</span>
        <div class="ivedimas">
          <input type="text" id="at${p.idx}" autocomplete="off" inputmode="text" placeholder="?">
          <div class="simb-row">${simbHtml}</div>
        </div>
        <span class="zenklas" id="zn${p.idx}"></span>
        <div class="sprendimas" id="sp${p.idx}"></div>
      </div>`;
    });
    div.innerHTML = html;
    cont.appendChild(div);
  }
}

function naujiSkaiciai(){
  sugeneruoti();
  pieshti();
  $('busena').className = 'busena';
  $('busena').textContent = 'Naujas variantas paruoštas. Sėkmės!';
}

function patikrinti(){
  let correct = 0, answered = 0;
  PROBLEMS.forEach(p=>{
    const inp = $('at'+p.idx);
    const ok = teisingas(p, inp.value);
    const zn = $('zn'+p.idx);
    const sp = $('sp'+p.idx);
    inp.classList.remove('ok','ne');
    if(ok === null){ zn.textContent=''; sp.style.display='none'; return; }
    answered++;
    if(ok){ correct++; inp.classList.add('ok'); zn.textContent='✓'; }
    else{ inp.classList.add('ne'); zn.textContent='✗'; }
    if(sp){
      const steps = (p.steps||[]).map(s=>fmtMath(s)).join(' → ');
      if(ok && !steps){
        sp.innerHTML = '';
        sp.style.display = 'none';
      } else {
        sp.innerHTML = ok
          ? `<b>Sprendimas:</b> ${steps}`
          : `<b>Teisingas atsakymas:</b> ${fmtMath(atsTekstas(p))}` + (steps ? ` — <b>sprendimas:</b> ${steps}` : '');
        sp.style.display = 'block';
      }
    }
  });
  const total = PROBLEMS.length;
  const b = $('busena');
  if(answered < total){
    b.className = 'busena';
    b.textContent = `Liko neatsakyta: ${total-answered}. Patikrink, ar visi laukai užpildyti.`;
    return;
  }
  b.className = 'busena ' + (correct===total ? 'ok' : (correct===0 ? 'ne' : ''));
  b.textContent = `Teisingai: ${correct} iš ${total}.` + (correct===total ? ' Puiku!' : '');
}

const SIMBOLIAI = (META.simboliai && META.simboliai.length) ? META.simboliai : ['−',','];

function insSymbol(inputId, ch){
  const el = document.getElementById(inputId);
  if(!el) return;
  const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,s) + ch + el.value.slice(e);
  const pos = s + ch.length;
  el.focus();
  el.setSelectionRange(pos,pos);
}
$('grupes').addEventListener('click', e=>{
  const b = e.target.closest('.simb');
  if(!b) return;
  insSymbol(b.dataset.target, b.dataset.ch);
});

$('tikrinti').addEventListener('click', patikrinti);
$('nauji').addEventListener('click', naujiSkaiciai);
$('spausdinti').addEventListener('click', ()=>window.print());

$('antraste').textContent = META.title || 'Treniruoklis';
$('paantraste').textContent = META.subtitle || '';
document.title = META.title || 'Treniruoklis';

if(META.grizti){ $('grizti').href = META.grizti; $('grizti').style.display=''; }
if(META.poraste) $('poraste').textContent = META.poraste;

naujiSkaiciai();
