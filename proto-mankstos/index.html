<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto mankšta · Mokytoja Violeta</title>
<style>
  :root{--tema:#1e5fa8;--tema-t:#2b74c4;--pilka:#5b6472;--bg:#eef2f7;--kort:#fff;--tekst:#1c2430;--linija:#d8dee6}
  @media (prefers-color-scheme:dark){:root{--bg:#131720;--kort:#1c2230;--tekst:#e7ecf3;--linija:#2c3648;--pilka:#9aa6b6}}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tekst);min-height:100vh;padding:38px 16px 54px}
  .wrap{max-width:720px;margin:0 auto}
  header{text-align:center;margin-bottom:26px}
  h1{font-size:28px;color:var(--tema-t);margin:0 0 6px}
  .sub{font-size:14px;color:var(--pilka);margin:0}
  .grizti{display:inline-block;margin:10px 0 0;color:var(--tema-t);font-size:13px;text-decoration:none}
  .grizti:hover{text-decoration:underline}
  .list-title{font-size:16px;font-weight:700;color:var(--tekst);margin:0 0 10px}
  .list{background:var(--kort);border:1px solid var(--linija);border-radius:14px;overflow:hidden;
    box-shadow:0 3px 14px rgba(0,0,0,.07)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;
    text-decoration:none;color:inherit;border-bottom:1px solid var(--linija)}
  .row:last-child{border-bottom:none}
  a.row:hover{background:rgba(30,95,168,.06)}
  .row-label{font-size:16px;font-weight:600;color:var(--tema-t);display:flex;align-items:center;gap:10px}
  .ikon{font-size:20px;line-height:1}
  .badge{flex:none;width:32px;height:32px;border-radius:50%;background:var(--tema);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .row.off{cursor:default;opacity:.55}
  .pill{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--pilka);border-radius:20px;padding:3px 10px}
  footer{text-align:center;margin-top:30px;font-size:12.5px;color:var(--pilka)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🧠 Proto mankšta</h1>
<p class="sub">Trumpi žaidimai atminčiai, dėmesiui ir greitam skaičiavimui lavinti</p>
<a class="grizti" href="../">← Visos klasės</a></header>

<p class="list-title">Kategorijos:</p>
<div class="list">
<a class="row" href="atmintis/"><span class="row-label"><span class="ikon">🧠</span> Atmintis</span><span class="badge">7</span></a>
<a class="row" href="demesys/"><span class="row-label"><span class="ikon">👁</span> Dėmesys ir pastabumas</span><span class="badge">8</span></a>
<div class="row off"><span class="row-label"><span class="ikon">⚡</span> Greitas skaičiavimas</span><span class="pill">netrukus</span></div>
</div>

<footer>Mokytoja Violeta · trumpa proto mankšta prieš ar po pamokos</footer></div>
</body>
</html>
